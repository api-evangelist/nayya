aid: nayya
name: Nayya
description: >-
  Nayya is an AI-powered health and wealth benefits decision-support platform used by
  employers, brokers, carriers, and benefits-administration partners to help employees
  choose and use their benefits. Its "Choose" experience delivers personalized plan
  recommendations, and its agentic adviser can answer benefits questions and file
  supplemental-health claims on an employee's behalf. Nayya exposes a partner-facing
  REST API — Nayya Integrate — with three surfaces (Accounts, Benefits, and Choose) that
  let integrators map employers, employees, and dependents, configure benefits, snapshot
  an employee's context, retrieve recommendations, and record enrollments, plus an embedded
  UI that partners drop into their own enrollment flow via SSO.
